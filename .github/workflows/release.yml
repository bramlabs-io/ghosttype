name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Create DMG
        run: ./scripts/create-dmg.sh

      - name: Rename DMG with version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv build/GhostType-Installer.dmg build/GhostType-${VERSION}.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/GhostType-*.dmg
          body: |
            ## Install

            ```bash
            brew install --cask bramlabs-io/ghosttype/ghosttype
            ```

            Then launch GhostType and grant Accessibility permissions when prompted.
